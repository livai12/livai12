<svg width="1000" height="300" viewBox="0 0 1000 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070714"/>
      <stop offset="40%" stop-color="#110c2e"/>
      <stop offset="80%" stop-color="#24104d"/>
      <stop offset="100%" stop-color="#0a0319"/>
    </linearGradient>

    <!-- Grid Horizon Gradient -->
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Planet Gradient -->
    <linearGradient id="planetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Text Glow Filter -->
    <filter id="neonGlowPink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur1" />
      <feGaussianBlur stdDeviation="10" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="neonGlowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="neonTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <style>
    .title-font { font-family: 'Montserrat', 'Inter', -apple-system, sans-serif; font-weight: 800; letter-spacing: 6px; }
    .script-font { font-family: 'Brush Script MT', 'Dancing Script', 'Caveat', cursive, sans-serif; font-size: 26px; fill: #ec4899; }
    .sub-font { font-family: 'JetBrains Mono', 'Fira Code', monospace; letter-spacing: 4px; font-weight: 600; font-size: 11px; }
  </style>

  <!-- Canvas Background -->
  <rect width="1000" height="300" rx="16" fill="url(#skyGrad)"/>

  <!-- Starfield Points -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="95" cy="45" r="1.5" />
    <circle cx="160" cy="110" r="1" />
    <circle cx="230" cy="60" r="2" opacity="0.8"/>
    <circle cx="340" cy="85" r="1" />
    <circle cx="480" cy="30" r="1.5" />
    <circle cx="620" cy="70" r="1" />
    <circle cx="780" cy="40" r="2" opacity="0.9"/>
    <circle cx="890" cy="100" r="1.2" />
    <circle cx="920" cy="50" r="1.5" />
    <circle cx="70" cy="140" r="1.2" />
    <circle cx="840" cy="130" r="1" />
    <polygon points="500,45 503,53 511,56 503,59 500,67 497,59 489,56 497,53" fill="#38bdf8" opacity="0.8"/>
    <polygon points="180,35 182,41 188,43 182,45 180,51 178,45 172,43 178,41" fill="#ec4899" opacity="0.8"/>
    <polygon points="820,65 822,71 828,73 822,75 820,81 818,75 812,73 818,71" fill="#a855f7" opacity="0.8"/>
  </g>

  <!-- Left Glowing Planet with Rings -->
  <g transform="translate(140, 140)">
    <!-- Planet Body -->
    <circle cx="0" cy="0" r="42" fill="url(#planetGrad)" filter="url(#neonGlowPink)"/>
    <!-- Ring Back -->
    <ellipse cx="0" cy="0" rx="64" ry="16" fill="none" stroke="#ec4899" stroke-width="2.5" opacity="0.6" transform="rotate(-22)"/>
    <!-- Ring Front -->
    <path d="M -60 22 C -40 38, 40 30, 60 1" fill="none" stroke="#38bdf8" stroke-width="3" filter="url(#neonGlowCyan)" transform="rotate(-22)"/>
  </g>

  <!-- Right Floating Cyber Ring / Satellite -->
  <g transform="translate(860, 110)">
    <circle cx="0" cy="0" r="28" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="46" ry="12" fill="none" stroke="#ec4899" stroke-width="2" stroke-dasharray="6 4" transform="rotate(25)" filter="url(#neonGlowPink)"/>
    <circle cx="0" cy="0" r="8" fill="#38bdf8" filter="url(#neonGlowCyan)"/>
  </g>

  <!-- Perspective 3D Synthwave Grid Floor (Lower Third) -->
  <g transform="translate(0, 195)">
    <!-- Horizon Glow -->
    <line x1="0" y1="0" x2="1000" y2="0" stroke="#ec4899" stroke-width="2.5" filter="url(#neonGlowPink)"/>

    <!-- Grid Horizontal Lines -->
    <line x1="0" y1="12" x2="1000" y2="12" stroke="url(#gridGrad)" stroke-width="1"/>
    <line x1="0" y1="26" x2="1000" y2="26" stroke="url(#gridGrad)" stroke-width="1.2"/>
    <line x1="0" y1="44" x2="1000" y2="44" stroke="url(#gridGrad)" stroke-width="1.5"/>
    <line x1="0" y1="68" x2="1000" y2="68" stroke="url(#gridGrad)" stroke-width="1.8"/>
    <line x1="0" y1="98" x2="1000" y2="98" stroke="url(#gridGrad)" stroke-width="2.2"/>

    <!-- Vanishing Perspective Lines -->
    <line x1="500" y1="0" x2="500" y2="105" stroke="url(#gridGrad)" stroke-width="1.5"/>
    <line x1="500" y1="0" x2="400" y2="105" stroke="url(#gridGrad)" stroke-width="1.2"/>
    <line x1="500" y1="0" x2="600" y2="105" stroke="url(#gridGrad)" stroke-width="1.2"/>
    <line x1="500" y1="0" x2="280" y2="105" stroke="url(#gridGrad)" stroke-width="1.2"/>
    <line x1="500" y1="0" x2="720" y2="105" stroke="url(#gridGrad)" stroke-width="1.2"/>
    <line x1="500" y1="0" x2="140" y2="105" stroke="url(#gridGrad)" stroke-width="1.5"/>
    <line x1="500" y1="0" x2="860" y2="105" stroke="url(#gridGrad)" stroke-width="1.5"/>
    <line x1="500" y1="0" x2="-20" y2="105" stroke="url(#gridGrad)" stroke-width="1.8"/>
    <line x1="500" y1="0" x2="1020" y2="105" stroke="url(#gridGrad)" stroke-width="1.8"/>
  </g>

  <!-- Center Typography & Brand Identity -->
  <g text-anchor="middle">
    <!-- Starburst Cross above Name -->
    <path d="M 500 68 L 500 88 M 490 78 L 510 78" stroke="#ffffff" stroke-width="2.5" filter="url(#neonGlowCyan)"/>
    <circle cx="500" cy="78" r="3" fill="#ffffff"/>

    <!-- Main Name -->
    <text x="500" y="128" class="title-font" font-size="34" fill="url(#neonTitle)" filter="url(#neonGlowPink)">NAUFAL ARDHANA</text>

    <!-- Subtitle Role Badge -->
    <text x="500" y="156" class="script-font">AI Engineer &amp; Systems Builder</text>

    <!-- Core Specialties / Tagline -->
    <text x="500" y="184" class="sub-font" fill="#38bdf8" filter="url(#neonGlowCyan)">MACHINE LEARNING • SPORTS ANALYTICS • CYBERSECURITY</text>
  </g>

  <!-- Subtle Border Frame -->
  <rect x="1" y="1" width="998" height="298" rx="15" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.5"/>
</svg>
