<svg width="1000" height="180" viewBox="0 0 1000 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Refined Minimal Dark Gradient -->
    <linearGradient id="minimalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Subtle Accent Line Gradient -->
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <style>
    .name-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 4px;
      fill: url(#textGrad);
    }
    .role-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 1.5px;
      fill: #94a3b8;
    }
    .meta-text {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 2px;
      fill: #38bdf8;
    }
  </style>

  <!-- Clean Container with Subtle Border -->
  <rect x="1" y="1" width="998" height="178" rx="12" fill="url(#minimalBg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Centered Content -->
  <g text-anchor="middle">
    <!-- Main Name -->
    <text x="500" y="72" class="name-text">NAUFAL ARDHANA</text>

    <!-- Role / Discipline -->
    <text x="500" y="104" class="role-text">Information Technology @ Institut Teknologi Sepuluh Nopember</text>

    <!-- Sleek Minimal Accent Divider -->
    <line x1="380" y1="122" x2="620" y2="122" stroke="url(#accentLine)" stroke-width="1.5"/>

    <!-- Core Domains -->
    <text x="500" y="146" class="meta-text">ARTIFICIAL INTELLIGENCE • SPORTS ANALYTICS • SYSTEMS &amp; SECURITY</text>
  </g>
</svg>
